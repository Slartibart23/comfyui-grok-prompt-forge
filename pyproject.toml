[project]
name = "comfyui-grok-prompt-forge"
description = "ComfyUI custom nodes for the xAI Grok API: prompt generation, text refinement, vision captioning and batch text loading — with full sampling control (temperature, top_p, penalties, seed-based cache busting) and beginner-friendly tooltips on every option."
version = "2.0.1"
license = { file = "LICENSE" }
dependencies = ["requests>=2.28", "Pillow>=9.0", "numpy>=1.24"]

[project.urls]
Repository = "https://github.com/Slartibart23/comfyui-grok-prompt-forge"

[tool.comfy]
DisplayName = "Grok Prompt Forge (xAI)"
PublisherId = "slartibart23b"
