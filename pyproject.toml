[project]
name = "comfyui-grok-prompt-forge"
description = "ComfyUI nodes for the xAI Grok API: turn ideas or captions (any language) into optimal English prompts for Krea 2, Qwen-Image 2.1, Z-Image, FLUX, Illustrious, Pony, SDXL, Wan and MiniMax H3 — editable, savable task presets, up to three reference images, standard negative prompts, LoRA caption refinement and image captioning."
version = "3.2.0"
license = { file = "LICENSE" }
dependencies = ["requests>=2.28", "Pillow>=9.0", "numpy>=1.24"]

[project.urls]
Repository = "https://github.com/Slartibart23/comfyui-grok-prompt-forge"

[tool.comfy]
DisplayName = "Grok Prompt Forge (xAI)"
PublisherId = "slartibart23b"
